<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Notion Task Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./notion-task-tracker.css">
</head>
<body>
  <div class="glow-bg"></div>

  <div class="tracker-wrapper">
    <!-- Header with Sync at top right -->
    <header class="tracker-header">
      <div class="brand">
        <a href="../../notion-dashboard/notion-dashboard.html" class="back-link" title="Back to Dashboard">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="brand-icon">
          <i class="fa-solid fa-list-check"></i>
        </div>
        <div>
          <h1>Task Tracker</h1>
        </div>
      </div>

      <div class="header-actions">
        <button id="refreshBtn" class="action-btn secondary-btn" title="Sync live tasks">
          <i class="fa-solid fa-rotate refresh-icon"></i>
          <span>Sync</span>
        </button>
      </div>
    </header>

    <!-- Telemetry Row: Single Line View -->
    <section class="master-panel">
      <div class="panel-left">
        <div class="metric-row single-line-metrics">
          <div class="metric-block">
            <span class="metric-label">Total</span>
            <span id="totalCount" class="metric-number">0</span>
          </div>
          <div class="metric-block">
            <span class="metric-label">To Do</span>
            <span id="todoCount" class="metric-number todo-num">0</span>
          </div>
          <div class="metric-block">
            <span class="metric-label">In Progress</span>
            <span id="progressCount" class="metric-number prog-num">0</span>
          </div>
          <div class="metric-block">
            <span class="metric-label">Completed</span>
            <span id="completedCount" class="metric-number accent-num">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Filter Bar: Master is default -->
    <nav class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search checklist..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="filter-pills-wrap">
        <div class="filter-pills" id="statusFilterPills">
          <button class="pill active" data-status="master">Master</button>
          <button class="pill" data-status="all">All</button>
          <button class="pill" data-status="todo">Not Started</button>
          <button class="pill" data-status="in-progress">In Progress</button>
          <button class="pill" data-status="done">Completed (Today+)</button>
        </div>
      </div>
    </nav>

    <!-- ONLY Scrollable Container -->
    <main id="tasksContainer" class="checklist-container"></main>
  </div>

  <!-- Floating Add Task Button (Bottom Right) -->
  <button id="openNewTaskBtn" class="fab-btn" title="Add New Task">
    <i class="fa-solid fa-plus"></i>
    <span>Task</span>
  </button>

  <!-- New Task Modal (Closes ONLY on Cancel click) -->
  <div id="newTaskModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <i class="fa-solid fa-plus-circle" style="color: var(--notion-grey-primary); font-size: 1.1rem;"></i>
          <h3>Add New Task</h3>
        </div>
      </div>

      <form id="newTaskForm" class="modal-form">
        <!-- 1. Task Name -->
        <div class="form-group">
          <label for="taskTitleInput">Task Name *</label>
          <input type="text" id="taskTitleInput" placeholder="What needs to be done?" required autocomplete="off" />
        </div>

        <!-- 2. Due Date with Time Toggle and Quick Buttons -->
        <div class="form-group date-block">
          <div class="date-header-row">
            <label for="taskDateInput">Due Date</label>
            <label class="time-toggle-label">
              <input type="checkbox" id="taskIncludeTimeToggle" />
              <span>Include Time</span>
            </label>
          </div>

          <div class="date-inputs-row">
            <input type="date" id="taskDateInput" />
            <input type="time" id="taskTimeInput" class="time-input hidden" />
          </div>

          <div class="date-shortcuts">
            <button type="button" class="date-btn active" id="btnDateToday">Today</button>
            <button type="button" class="date-btn" id="btnDateTomorrow">Tomorrow</button>
            <button type="button" class="date-btn" id="btnDateNoDue">No Due</button>
          </div>
        </div>

        <!-- 3. Priority -->
        <div class="form-group">
          <label for="taskPriorityInput">Priority</label>
          <select id="taskPriorityInput">
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
            <option value="Lowest">Lowest</option>
          </select>
        </div>

        <!-- 4. Description -->
        <div class="form-group">
          <label for="taskDescInput">Description (Optional)</label>
          <textarea id="taskDescInput" rows="2" placeholder="Add extra context or notes..."></textarea>
        </div>

        <!-- 5. URL -->
        <div class="form-group">
          <label for="taskUrlInput">URL (Optional)</label>
          <input type="url" id="taskUrlInput" placeholder="https://..." autocomplete="off" />
        </div>

        <!-- 6. Person -->
        <div class="form-group">
          <label for="taskPersonInput">Person</label>
          <div class="person-field-pill">
            <i class="fa-solid fa-user-circle"></i>
            <span id="personNameDisplay">Paresh Bafna</span>
          </div>
        </div>

        <!-- Single Row Footer: Cancel Left, Create Right -->
        <div class="modal-footer single-row-footer">
          <button type="button" id="cancelModalBtn" class="action-btn secondary-btn modal-btn">Cancel</button>
          <button type="submit" id="submitTaskBtn" class="action-btn primary-btn modal-btn">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Create Task</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">Updated</span>
  </div>

  <script src="./notion-task-tracker.js"></script>
</body>
</html>
