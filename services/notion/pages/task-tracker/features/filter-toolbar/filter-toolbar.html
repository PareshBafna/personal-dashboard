<!-- File: services/notion/pages/task-tracker/features/filter-toolbar/filter-toolbar.html -->
<div class="filter-toolbar">
  <div class="search-input-wrap">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="taskSearchInput" class="task-search-input" placeholder="Search checklist..." autocomplete="off" />
    <button type="button" id="taskSearchClearBtn" class="search-clear-btn" style="display: none;">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="view-switch-pills">
    <button type="button" class="view-pill-btn" data-status="inbox">Inbox</button>
    <button type="button" class="view-pill-btn active" data-status="master">Master</button>
  </div>
</div>
