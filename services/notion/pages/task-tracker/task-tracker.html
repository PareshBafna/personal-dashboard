<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Notion Task Tracker</title>
  <link rel="apple-touch-icon" href="/global/icons/apple-touch-icon-tasks.png" />
  <meta name="theme-color" content="#05070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Task Tracker" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Personal Dashboard" />
  <meta property="og:title" content="Notion Task Tracker" />
  <meta property="og:image" content="https://personal-dashboard-bbw.pages.dev/global/icons/og-tasks.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:image:alt" content="Task Tracker icon" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./task-tracker.css">
</head>
<body>
  <div class="glow-bg"></div>

  <div class="tracker-wrapper">
    <header class="tracker-header">
      <div class="brand">
        <a href="../../notion.html" class="back-link" title="Back to Notion Hub">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="brand-icon">
          <i class="fa-solid fa-list-check"></i>
        </div>
        <div>
          <h1>Task Tracker</h1>
        </div>
      </div>

      <div class="header-actions">
        <button id="refreshBtn" class="action-btn secondary-btn" title="Sync live tasks">
          <i class="fa-solid fa-rotate refresh-icon"></i>
          <span>Sync</span>
        </button>
      </div>
    </header>

    <div id="telemetrySlot"></div>
    <div class="filter-toolbar">
      <div id="searchBarSlot" style="flex: 1 1 auto; max-width: 480px;"></div>
      <div id="viewTabsSlot"></div>
    </div>

    <main id="tasksContainer" class="checklist-container"></main>
  </div>

  <div id="addTaskSlot"></div>
  <div id="customDateModalSlot"></div>

  <div id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">Updated</span>
  </div>

  <script type="module" src="./task-tracker.js"></script>
  <script src="../../../common/security.js"></script>
</body>
</html>
