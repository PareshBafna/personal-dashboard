<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Notion Databases Command Hub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./databases.css">
</head>
<body>
  <div class="glow-bg"></div>

  <div class="dashboard-wrapper">
    <header class="dashboard-header">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-database" style="color: #60a5fa; font-size: 1.3rem;"></i>
        </div>
        <div>
          <h1>Notion Database Grid</h1>
          <p class="subtitle">Workspace Schema & Schema Property Inspector</p>
        </div>
      </div>

      <div class="header-actions">
        <a href="../task-tracker/task-tracker.html" class="action-btn secondary-btn" title="Open Task Tracker">
          <i class="fa-solid fa-list-check"></i>
          <span>Task Tracker</span>
        </a>
        <button id="refreshBtn" class="action-btn primary-btn" title="Sync Live Notion Schemas">
          <i class="fa-solid fa-rotate refresh-icon"></i>
          <span>Sync Databases</span>
        </button>
      </div>
    </header>

    <section class="master-panel">
      <div class="panel-left">
        <div class="stat-badge">
          <span class="live-indicator"></span> LIVE NOTION SCHEMAS
        </div>
        <div class="metric-row">
          <div class="metric-block">
            <span class="metric-label">Active Databases</span>
            <span id="dbCount" class="metric-number alloc-num">0</span>
          </div>
          <div class="metric-sep">/</div>
          <div class="metric-block">
            <span class="metric-label">Target Environment</span>
            <span class="metric-number accent-num">API v2022-06-28</span>
          </div>
        </div>
      </div>
    </section>

    <nav class="toolbar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="font-size: 0.85rem;"></i>
        <input type="text" id="searchInput" placeholder="Search database names..." autocomplete="off">
        <button id="clearSearchBtn" class="clear-btn hidden"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </nav>

    <main id="notion-container" class="accounts-grid"></main>
  </div>

  <div id="schemaModal" class="modal-backdrop">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span id="modalAvatar" class="account-avatar modal-mini-avatar">DB</span>
            <h3 id="modalDbName">Database Schema</h3>
          </div>
          <p id="modalDbId" class="modal-email"></p>
        </div>
        <button id="modalClose" class="modal-close-btn">&times;</button>
      </div>

      <div class="modal-toolbar">
        <span class="modal-badge-counter"><span id="modalPropCount">0</span> Properties</span>
        <input type="text" id="modalPropSearch" placeholder="Filter schema properties..." />
      </div>

      <div class="modal-body">
        <div id="propertiesList" class="properties-list"></div>
      </div>

      <div class="modal-footer">
        <button id="modalCopyId" class="action-btn secondary-btn">Copy Database ID</button>
        <a id="modalOpenNotion" href="#" target="_blank" class="action-btn primary-btn">Open in Notion ↗</a>
      </div>
    </div>
  </div>

  <div id="toast">
    <i class="fa-solid fa-circle-check" style="color: var(--color-green);"></i>
    <span id="toast-msg">Copied</span>
  </div>

  <script src="./databases.js"></script>
</body>
</html>
